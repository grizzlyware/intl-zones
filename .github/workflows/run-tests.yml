name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: ["8.4", "8.5"]
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit

  # A single check with a fixed name for main's ruleset to require. The matrix
  # job names contain the PHP version, so requiring those directly means every
  # pull request blocks the moment the matrix is edited — the old contexts stop
  # reporting and nothing satisfies the rule. This one never changes name.
  tests-passed:
    name: tests-passed
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check the matrix result
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "::error::Test matrix did not pass (${RESULT})."
            exit 1
          fi

          echo "Test matrix passed."
